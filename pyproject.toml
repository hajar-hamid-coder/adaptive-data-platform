[project]
name = "adp"
version = "0.1.0"
description = "Plateforme de Données Intelligente et Évolutive"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "openpyxl",
    "pydantic",
    "pydantic-settings>=2.16.2",
    "structlog>=26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adp"]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests nécessitant Docker, réseau ou clé LLM",
]
