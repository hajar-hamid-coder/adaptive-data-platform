[project]
name = "adp"
version = "0.1.0"
description = "Plateforme de Données Intelligente et Évolutive"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.5.2",
    "duckdb",
    "httpx>=0.28.1",
    "openpyxl",
    "psycopg[binary]>=3.3.8",
    "pydantic",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.8",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
]

[project.scripts]
adp = "adp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adp"]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "respx>=0.23.1",
    "ruff",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests nécessitant Docker, réseau ou clé LLM",
]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
